name: Android CI

# 每次提交到任意分支都会构建一次 debug APK，并上传到本次运行的 Artifacts。
# 发布正式版请推送 vX.Y.Z tag，由 Release 工作流处理。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest 已预装 Android SDK（Platform 36、Build Tools 35.0.0），直接使用即可。
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # 现有代码可能还有 lint 问题，这里只报告，不阻塞构建。
      - name: Run lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
