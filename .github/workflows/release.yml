name: Release

# 推送 vX.Y.Z tag 后：用 release 密钥签名打包，创建 GitHub Release，并在配置 GITEE_TOKEN 时同步到 Gitee。
# 也可以手动运行，填入一个已存在的 tag。
#
# 需要的仓库 Secrets（Settings > Secrets and variables > Actions）：
#   ANDROID_KEYSTORE_BASE64   签名密钥库文件的 base64 内容
#   ANDROID_KEYSTORE_PASSWORD 密钥库密码
#   ANDROID_KEY_ALIAS         密钥别名
#   ANDROID_KEY_PASSWORD      密钥密码
#   GITEE_TOKEN               Gitee 私人令牌（projects 权限），用于同步 Gitee Release；可选
#
# 生成 base64（PowerShell）：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks"))
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的 tag，例如 v3.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Validate tag and compute version
        run: |
          set -euo pipefail
          tag="$TAG"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag 必须形如 v1.2.3 或 v1.2.3-beta.1，当前为: $tag"
            exit 1
          fi

          version="${tag#v}"
          base="${version%%-*}"
          IFS='.' read -r major minor patch <<< "$base"
          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#$patch))

          if (( minor >= 100 || patch >= 100 )); then
            echo "::error::minor 和 patch 必须小于 100"
            exit 1
          fi

          # versionCode = major*10000000 + minor*100000 + patch*1000 + 阶段
          # 阶段：alpha=100+n，beta=200+n，rc=300+n，正式版=999。
          # 因此同一版本的预发布版 versionCode 小于正式版，且 beta 小于 rc。
          if [[ "$version" == *-* ]]; then
            prerelease=true
            pre="${version#*-}"
            stage="${pre%%[0-9.]*}"
            case "$stage" in
              alpha*) stage_base=100 ;;
              beta*)  stage_base=200 ;;
              rc*)    stage_base=300 ;;
              *)      stage_base=100 ;;
            esac
            pre_num=$(grep -oE '[0-9]+' <<< "$pre" | tail -n 1 || true)
            pre_num="${pre_num:-1}"
            pre_num=$((10#$pre_num))
            if (( pre_num >= 99 )); then
              echo "::error::预发布序号必须小于 99"
              exit 1
            fi
            version_code=$(( major * 10000000 + minor * 100000 + patch * 1000 + stage_base + pre_num ))
          else
            prerelease=false
            version_code=$(( major * 10000000 + minor * 100000 + patch * 1000 + 999 ))
          fi

          if (( version_code > 2100000000 )); then
            echo "::error::versionCode 超出 Android 上限"
            exit 1
          fi

          {
            echo "VERSION_NAME=$version"
            echo "VERSION_CODE=$version_code"
            echo "PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"

          {
            echo "## Release $tag"
            echo ""
            echo "- versionName: \`$version\`"
            echo "- versionCode: \`$version_code\`"
            echo "- prerelease: \`$prerelease\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest 已预装 Android SDK（Platform 36、Build Tools 35.0.0），直接使用即可。
      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::缺少仓库 secret: $name"
              missing=1
            fi
          done
          if (( missing != 0 )); then
            echo "::error::请先在仓库 Settings > Secrets and variables > Actions 中配置签名信息。"
            exit 1
          fi

          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          test -s "$RELEASE_KEYSTORE_FILE"

          keytool -list \
            -keystore "$RELEASE_KEYSTORE_FILE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Verify APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [[ -z "$apk" ]]; then
            echo "::error::没有找到 release APK"
            exit 1
          fi

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$apk"

          apk_name=$(basename "$apk")
          mkdir -p dist
          cp "$apk" "dist/$apk_name"
          sha256sum "dist/$apk_name" > "dist/$apk_name.sha256"

          {
            echo "APK_PATH=dist/$apk_name"
            echo "APK_NAME=$apk_name"
          } >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            args=(--title "$TAG" --verify-tag)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            # 可选：在 release-notes/<tag>.md 写发布说明；不存在时由 GitHub 自动生成。
            if [[ -f "release-notes/$TAG.md" ]]; then
              gh release create "$TAG" "$APK_PATH" "${args[@]}" --notes-file "release-notes/$TAG.md"
            else
              gh release create "$TAG" "$APK_PATH" "${args[@]}" --generate-notes
            fi
          fi

          url=$(gh release view "$TAG" --json url --jq .url)
          gh release view "$TAG" --json body --jq '.body // ""' > release-body.md
          echo "Release: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: uselesswater
          GITEE_REPO: CallLogGeneration
          BODY_FILE: release-body.md
        run: |
          export TARGET_SHA="$(git rev-parse HEAD)"
          bash .github/scripts/publish-gitee-release.sh
